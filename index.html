<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIPEDAS - Sistem Pelaporan Digital Satgas Linmas</title>
  <meta name="description" content="SIPEDAS adalah sistem pelaporan digital dan dashboard monitoring Satgas Linmas Kabupaten Ponorogo.">
  <meta name="robots" content="index,follow">
  
  <!-- FAVICON & PWA -->
  <link rel="icon" href="/assets/favicon.ico" sizes="any" type="image/x-icon">
  <link rel="icon" href="/assets/icon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/icon-48.png" sizes="48x48" type="image/png">
  <link rel="icon" href="/assets/icon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="/assets/icon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  
  <!-- PWA MANIFEST -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SI-PEDAS">
  <meta name="application-name" content="SI-PEDAS">
  
</head>

<body>
  <div id="root"></div>
  
  <script type="module" src="/src/main.tsx"></script>

  <!-- PWA SERVICE WORKER REGISTRATION -->
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
            .then(function (reg) { console.log('[SW] Terdaftar:', reg.scope); })
            .catch(function (err) { console.warn('[SW] Gagal:', err); });
        });
      }
    })();
  </script>
</body>

</html>
